<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Cash King - Level 1-9999</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --grid-bg: #334155;
            --cell-empty: #1e293b;
            --text-main: #f8fafc;
            --accent: #10b981; /* Đổi sang tông màu xanh lá tiền mặt */
            --accent-glow: rgba(16, 185, 129, 0.4);
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; overflow-x: hidden;
        }

        .game-container {
            width: 100%; max-width: 480px;
            background: var(--panel-bg); border-radius: 20px; padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
            display: flex; flex-direction: column; gap: 15px;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #475569; padding-bottom: 12px;
        }

        .logo {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(45deg, #10b981, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .stats { display: flex; gap: 10px; font-size: 13px; }
        .stat-box {
            background: rgba(0,0,0,0.2); padding: 6px 10px;
            border-radius: 8px; border: 1px solid #475569; text-align: center; min-width: 75px;
        }

        .stat-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-weight: bold; font-size: 14px; color: var(--gold); }
        .stat-val.cash { color: #10b981; }

        .level-control {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 12px; gap: 10px;
        }

        .level-control label { font-weight: 600; color: #cbd5e1; white-space: nowrap; }
        .level-input-container { display: flex; align-items: center; gap: 8px; }

        .btn-arrow {
            background: #475569; color: white; border: none;
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center;
        }
        .btn-arrow:hover { background: var(--accent); }

        input[type="number"], input[type="text"], select {
            background: #0f172a; border: 1px solid #475569; color: #fff; padding: 8px; border-radius: 6px;
        }
        input[type="number"] { width: 70px; text-align: center; font-size: 16px; font-weight: bold; }

        .target-box {
            font-size: 12px; background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3); padding: 4px 8px; border-radius: 6px;
            color: #34d399; font-weight: 600;
        }

        .board-wrapper {
            position: relative; width: 100%; padding-top: 100%;
            background: #0f172a; border-radius: 12px; border: 4px solid #334155; overflow: hidden;
        }

        #board {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 2px; padding: 2px;
        }

        .cell { background-color: var(--cell-empty); border-radius: 4px; transition: background-color 0.15s ease, transform 0.1s ease; }
        .cell.preview-valid { opacity: 0.6; transform: scale(0.95); }
        .cell.preview-invalid { background-color: rgba(239, 68, 68, 0.4) !important; }

        .block-c1 { background: linear-gradient(135deg, #ff2a6d, #9100ff); box-shadow: inset 0 0 8px rgba(255,255,255,0.5); }
        .block-c2 { background: linear-gradient(135deg, #05d9e8, #01012b); box-shadow: inset 0 0 8px rgba(255,255,255,0.5); }
        .block-c3 { background: linear-gradient(135deg, #fcee0a, #ff007f); box-shadow: inset 0 0 8px rgba(255,255,255,0.5); }
        .block-c4 { background: linear-gradient(135deg, #00ff66, #006622); box-shadow: inset 0 0 8px rgba(255,255,255,0.5); }
        .block-c5 { background: linear-gradient(135deg, #ff9900, #ff3300); box-shadow: inset 0 0 8px rgba(255,255,255,0.5); }
        .block-c6 { background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: inset 0 0 8px rgba(255,255,255,0.5); }
        .block-obstacle { background: radial-gradient(circle, #64748b 20%, #334155 80%); border: 2px solid #1e293b; cursor: not-allowed; }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }
        .cell.exploding { animation: explode 0.4s forwards ease-out; z-index: 10; }

        .tray {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.15); padding: 12px; border-radius: 12px; height: 110px; gap: 10px;
        }

        .tray-slot {
            flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.02); border: 2px dashed #475569; border-radius: 8px; cursor: pointer;
        }
        .tray-slot.selected { border-color: var(--gold); background: rgba(245, 158, 11, 0.1); transform: scale(1.03); }

        .mini-grid { display: grid; gap: 2px; }
        .mini-cell { width: 16px; height: 16px; border-radius: 3px; }
        .mini-cell.empty { background: transparent; }

        .controls { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; color: white; text-align: center; }
        .btn-reset { background: #ef4444; }
        .btn-reroll { background: #475569; }

        /* Cổng Rút Tiền Bổ Sung */
        .wallet-section {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .wallet-title { font-size: 15px; font-weight: bold; color: #34d399; display: flex; align-items: center; justify-content: space-between; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .input-row { display: flex; gap: 8px; }
        .input-row select, .input-row input { flex: 1; }
        .btn-withdraw {
            background: linear-gradient(135deg, #10b981, #059669); color: white; font-weight: bold;
            padding: 10px; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px;
        }

        .overlay-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; text-align: center; padding: 20px;
        }
        .overlay-modal.show { opacity: 1; pointer-events: auto; }
        .overlay-modal h2 { font-size: 28px; margin-bottom: 10px; }
        .overlay-modal p { margin-bottom: 20px; color: #cbd5e1; }
        
        .win-title { color: #10b981; text-shadow: 0 0 10px rgba(16,185,129,0.5); }
        .reward-amount { font-size: 36px; font-weight: 800; color: #f59e0b; margin: 15px 0; }
        .btn-modal-action { background: #10b981; padding: 10px 25px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; }
        .hint-text { text-align: center; font-size: 11px; color: #64748b; }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <div class="logo">Block Blast</div>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Điểm số</div>
                    <div id="score" class="stat-val">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Số hàng phá</div>
                    <div id="lines-cleared" class="stat-val">0 / 3</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Ví Tiền Mặt</div>
                    <div id="wallet-balance" class="stat-val cash">0đ</div>
                </div>
            </div>
        </header>

        <div class="level-control">
            <div>
                <label for="level-select">Cấp Độ:</label>
                <div class="level-input-container" style="margin-top: 4px;">
                    <button class="btn-arrow" id="lvl-prev">&lt;</button>
                    <input type="number" id="level-select" min="1" max="9999" value="1">
                    <button class="btn-arrow" id="lvl-next">&gt;</button>
                </div>
            </div>
            <div class="target-box">Mục tiêu: Phá 3 hàng để WIN</div>
        </div>

        <div class="board-wrapper">
            <div id="board"></div>
            
            <div id="game-over" class="overlay-modal">
                <h2 style="color: #ef4444;">Thua Cuộc!</h2>
                <p>Không còn vị trí phù hợp cho các khối hình.</p>
                <button class="btn-modal-action" style="background:#ef4444;" onclick="resetGame()">Chơi Lại</button>
            </div>

            <div id="game-win" class="overlay-modal">
                <h2 class="win-title">CHIẾN THẮNG!</h2>
                <p>Chúc mừng bạn đã hoàn thành Cấp độ <span id="popup-lvl-num">1</span></p>
                <div class="reward-amount">+$<span id="popup-reward-val">0</span>đ</div>
                <button class="btn-modal-action" onclick="advanceNextLevel()">Nhận Thưởng & Lên Cấp</button>
            </div>
        </div>

        <div class="tray" id="tray">
            <div class="tray-slot" id="slot-0" onclick="selectSlot(0)"></div>
            <div class="tray-slot" id="slot-1" onclick="selectSlot(1)"></div>
            <div class="tray-slot" id="slot-2" onclick="selectSlot(2)"></div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetGame()">Chơi Lại</button>
            <button class="btn btn-reroll" onclick="rerollTray()">Đổi Khối Hình</button>
        </div>

        <div class="wallet-section">
            <div class="wallet-title">
                <span>RÚT TIỀN VỀ TÀI KHOẢN</span>
                <span style="font-size: 11px; color: #94a3b8; font-weight: normal;">Hỗ trợ tự động</span>
            </div>
            
            <div class="input-group">
                <label>Hệ thống nhận tiền</label>
                <select id="withdraw-method">
                    <option value="Momo">Ví Điện Tử Momo</option>
                    <option value="Zalo Pay">Ví Điện Tử Zalo Pay</option>
                    <option value="MB Bank">Ngân hàng MB Bank (Quân Đội)</option>
                </select>
            </div>

            <div class="input-row">
                <div class="input-group" style="flex: 1.2;">
                    <label>Số tài khoản / Số điện thoại</label>
                    <input type="text" id="withdraw-acc-num" placeholder="Nhập số tài khoản...">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Tên chủ thẻ (Không dấu)</label>
                    <input type="text" id="withdraw-name" placeholder="NGUYEN VAN A">
                </div>
            </div>

            <button class="btn-withdraw" onclick="processWithdrawal()">Xác Nhận Rút Tiền</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0;
        let linesClearedCount = 0;
        const TARGET_LINES = 3;

        let cashBalance = parseInt(localStorage.getItem('block_blast_cash_bal')) || 0;
        let currentLevel = 1;
        let trayBlocks = [null, null, null];
        let selectedSlotIndex = null;
        let hoveredCells = [];

        const SHAPES = [
            { matrix: [[1]], color: 'block-c1' }, { matrix: [[1, 1]], color: 'block-c1' },
            { matrix: [[1], [1]], color: 'block-c1' }, { matrix: [[1, 1, 1]], color: 'block-c2' },
            { matrix: [[1], [1], [1]], color: 'block-c2' }, { matrix: [[1, 1], [1, 1]], color: 'block-c3' },
            { matrix: [[1, 1, 1], [0, 1, 0]], color: 'block-c4' }, { matrix: [[1, 0], [1, 0], [1, 1]], color: 'block-c5' },
            { matrix: [[0, 1], [0, 1], [1, 1]], color: 'block-c5' }, { matrix: [[1, 1, 1, 1]], color: 'block-c6' },
            { matrix: [[1], [1], [1], [1]], color: 'block-c6' }, { matrix: [[1, 1, 0], [0, 1, 1]], color: 'block-c3' },
            { matrix: [[0, 1, 1], [1, 1, 0]], color: 'block-c4' }
        ];

        document.getElementById('wallet-balance').innerText = cashBalance + "đ";

        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        const boardEl = document.getElementById('board');
        function createBoardUI() {
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.addEventListener('mouseenter', () => handleCellMouseEnter(r, c));
                    cell.addEventListener('mouseleave', handleCellMouseLeave);
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function generateLevel(levelNum) {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            score = 0; linesClearedCount = 0; updateScoreUI();
            document.getElementById('game-over').classList.remove('show');
            document.getElementById('game-win').classList.remove('show');
            selectedSlotIndex = null; clearSelectionStyles();

            let obstacleCount = 0;
            if (levelNum > 3 && levelNum <= 20) obstacleCount = 2;
            else if (levelNum > 20 && levelNum <= 100) obstacleCount = 4;
            else if (levelNum > 100 && levelNum <= 1000) obstacleCount = 6;
            else if (levelNum > 1000) obstacleCount = 8;

            let seed = levelNum * 555.555;
            let placed = 0;
            while (placed < obstacleCount) {
                let randIndex = Math.floor(seededRandom(seed) * (BOARD_SIZE * BOARD_SIZE)); seed += 1;
                let r = Math.floor(randIndex / BOARD_SIZE); let c = randIndex % BOARD_SIZE;
                if (boardState[r][c] === 0) { boardState[r][c] = 'block-obstacle'; placed++; }
            }
            renderBoard(); generateNewTray();
        }

        function renderBoard() {
            const cells = boardEl.children;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const idx = r * BOARD_SIZE + c; const cellEl = cells[idx];
                    cellEl.className = 'cell';
                    if (boardState[r][c] !== 0) cellEl.classList.add(boardState[r][c]);
                }
            }
        }

        function generateNewTray() {
            for (let i = 0; i < 3; i++) {
                let randIdx = Math.floor(Math.random() * SHAPES.length);
                trayBlocks[i] = JSON.parse(JSON.stringify(SHAPES[randIdx]));
                renderTraySlot(i);
            }
            checkGameOverCondition();
        }

        function rerollTray() { generateNewTray(); }

        function renderTraySlot(index) {
            const slot = document.getElementById(`slot-${index}`); slot.innerHTML = '';
            const block = trayBlocks[index]; if (!block) return;
            const matrix = block.matrix; const rows = matrix.length; const cols = matrix[0].length;
            const miniGrid = document.createElement('div'); miniGrid.classList.add('mini-grid'); miniGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const miniCell = document.createElement('div'); miniCell.classList.add('mini-cell');
                    if (matrix[r][c] === 1) miniCell.classList.add(block.color);
                    else miniCell.classList.add('empty');
                    miniGrid.appendChild(miniCell);
                }
            }
            slot.appendChild(miniGrid);
        }

        function selectSlot(index) {
            if (!trayBlocks[index]) return;
            if (selectedSlotIndex === index) { selectedSlotIndex = null; clearSelectionStyles(); }
            else { selectedSlotIndex = index; clearSelectionStyles(); document.getElementById(`slot-${index}`).classList.add('selected'); }
        }

        function clearSelectionStyles() {
            for (let i = 0; i < 3; i++) document.getElementById(`slot-${i}`).classList.remove('selected');
        }

        function handleCellMouseEnter(startR, startC) {
            if (selectedSlotIndex === null || !trayBlocks[selectedSlotIndex]) return;
            const block = trayBlocks[selectedSlotIndex]; const matrix = block.matrix; const valid = canPlaceBlock(startR, startC, matrix);
            hoveredCells = [];
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] === 1) {
                        let targetR = startR + r; let targetC = startC + c;
                        if (targetR < BOARD_SIZE && targetC < BOARD_SIZE) {
                            let idx = targetR * BOARD_SIZE + targetC; let cellEl = boardEl.children[idx];
                            if (cellEl) {
                                cellEl.classList.add(valid ? 'preview-valid' : 'preview-invalid');
                                if (valid) cellEl.classList.add(block.color);
                                hoveredCells.push({el: cellEl, originalColor: block.color});
                            }
                        }
                    }
                }
            }
        }

        function handleCellMouseLeave() {
            hoveredCells.forEach(item => item.el.classList.remove('preview-valid', 'preview-invalid', item.originalColor));
            hoveredCells = []; renderBoard();
        }

        function canPlaceBlock(startR, startC, matrix) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] === 1) {
                        let targetR = startR + r; let targetC = startC + c;
                        if (targetR >= BOARD_SIZE || targetC >= BOARD_SIZE) return false;
                        if (boardState[targetR][targetC] !== 0) return false;
                    }
                }
            }
            return true;
        }

        function handleCellClick(startR, startC) {
            if (selectedSlotIndex === null || !trayBlocks[selectedSlotIndex]) return;
            const block = trayBlocks[selectedSlotIndex]; const matrix = block.matrix;
            if (canPlaceBlock(startR, startC, matrix)) {
                for (let r = 0; r < matrix.length; r++) {
                    for (let c = 0; c < matrix[r].length; c++) {
                        if (matrix[r][c] === 1) boardState[startR + r][startC + c] = block.color;
                    }
                }
                score += matrix.flat().filter(v => v === 1).length;
                trayBlocks[selectedSlotIndex] = null; renderTraySlot(selectedSlotIndex);
                selectedSlotIndex = null; clearSelectionStyles();
                checkAndClearLines();
                if (trayBlocks.every(b => b === null)) generateNewTray();
                renderBoard(); updateScoreUI();
                if (linesClearedCount >= TARGET_LINES) triggerWinState();
                else checkGameOverCondition();
            }
        }

        function checkAndClearLines() {
            let rowsToClear = []; let colsToClear = [];
            for (let r = 0; r < BOARD_SIZE; r++) { if (boardState[r].every(cell => cell !== 0)) rowsToClear.push(r); }
            for (let c = 0; c < BOARD_SIZE; c++) {
                let colFull = true; for (let r = 0; r < BOARD_SIZE; r++) { if (boardState[r][c] === 0) { colFull = false; break; } }
                if (colFull) colsToClear.push(c);
            }
            let totalClears = rowsToClear.length + colsToClear.length;
            if (totalClears > 0) {
                linesClearedCount += totalClears; score += (totalClears * BOARD_SIZE) * totalClears;
                rowsToClear.forEach(r => { for (let c = 0; c < BOARD_SIZE; c++) { animateExplosion(r, c); boardState[r][c] = 0; } });
                colsToClear.forEach(c => { for (let r = 0; r < BOARD_SIZE; r++) { animateExplosion(r, c); boardState[r][c] = 0; } });
            }
        }

        function animateExplosion(r, c) {
            let idx = r * BOARD_SIZE + c; let cellEl = boardEl.children[idx];
            if (cellEl) { cellEl.classList.add('exploding'); setTimeout(() => cellEl.classList.remove('exploding'), 400); }
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('lines-cleared').innerText = `${linesClearedCount} / ${TARGET_LINES}`;
        }

        // TÍNH TOÁN TỶ LỆ THEO YÊU CẦU: 85% | 10% | 5%
        function calculateCashReward() {
            let roll = Math.random() * 100;
            if (roll <= 85) return Math.floor(Math.random() * 10) + 1; // 1đ - 10đ (85%)
            else if (roll <= 95) return Math.floor(Math.random() * 40) + 11; // 11đ - 50đ (10%)
            else return Math.floor(Math.random() * 50) + 51; // 51đ - 100đ (5%)
        }

        function triggerWinState() {
            let reward = calculateCashReward(); cashBalance += reward;
            localStorage.setItem('block_blast_cash_bal', cashBalance);
            document.getElementById('wallet-balance').innerText = cashBalance + "đ";
            document.getElementById('popup-lvl-num').innerText = currentLevel;
            document.getElementById('popup-reward-val').innerText = reward;
            document.getElementById('game-win').classList.add('show');
        }

        function advanceNextLevel() {
            if (currentLevel < 9999) { currentLevel++; document.getElementById('level-select').value = currentLevel; }
            generateLevel(currentLevel);
        }

        function checkGameOverCondition() {
            let matchesFound = false;
            for (let i = 0; i < 3; i++) {
                const block = trayBlocks[i]; if (!block) continue;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) { if (canPlaceBlock(r, c, block.matrix)) { matchesFound = true; break; } }
                    if (matchesFound) break;
                }
                if (matchesFound) break;
            }
            if (!matchesFound && trayBlocks.some(b => b !== null)) document.getElementById('game-over').classList.add('show');
        }

        function resetGame() { generateLevel(currentLevel); }

        // XỬ LÝ LỆNH RÚT TIỀN TIỀN MẶT
        function processWithdrawal() {
            const method = document.getElementById('withdraw-method').value;
            const accNum = document.getElementById('withdraw-acc-num').value.trim();
            const name = document.getElementById('withdraw-name').value.trim();

            if (!accNum || !name) { alert("Vui lòng điền đầy đủ số tài khoản và tên chủ thẻ!"); return; }
            if (cashBalance <= 0) { alert("Số dư ví của bạn đang là 0đ. Vui lòng vượt ải để kiếm thêm tiền mặt!"); return; }

            let confirmWithdraw = confirm(`Bạn muốn tạo lệnh rút toàn bộ ${cashBalance}đ về tài khoản ${method}?\n\nSTK: ${accNum}\nTên: ${name.toUpperCase()}`);
            if (confirmWithdraw) {
                alert(`Lệnh rút tiền thành công!\n\nHệ thống đang xử lý chuyển khoản ${cashBalance}đ về ví/ngân hàng ${method} của bạn. Vui lòng chờ 1-3 phút.`);
                cashBalance = 0; localStorage.setItem('block_blast_cash_bal', cashBalance);
                document.getElementById('wallet-balance').innerText = cashBalance + "đ";
                document.getElementById('withdraw-acc-num').value = ""; document.getElementById('withdraw-name').value = "";
            }
        }

        const lvlInput = document.getElementById('level-select');
        lvlInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value); if (isNaN(val) || val < 1) val = 1; if (val > 9999) val = 9999;
            e.target.value = val; currentLevel = val; resetGame();
        });
        document.getElementById('lvl-prev').addEventListener('click', () => { if (currentLevel > 1) { currentLevel--; lvlInput.value = currentLevel; resetGame(); } });
        document.getElementById('lvl-next').addEventListener('click', () => { if (currentLevel < 9999) { currentLevel++; lvlInput.value = currentLevel; resetGame(); } });

        createBoardUI(); generateLevel(currentLevel);
    </script>
</body>
</html>
