<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block V2.3.1 Cash King</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --grid-bg: #334155;
            --cell-empty: #1e293b;
            --text-main: #f8fafc;
            --accent: #10b981; 
            --accent-glow: rgba(16, 185, 129, 0.4);
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Cho phép cuộn nhẹ nếu màn hình quá ngắn, không ép chết khung */
            padding: 12px 4px; 
            overflow-x: hidden;
            touch-action: none; 
        }

        /* SỬA LỖI HIỂN THỊ: ÉP PHÓNG TO VỪA KHUNG HÌNH MOBILE */
        .game-container {
            width: 96% !important; /* Chiếm gần hết chiều ngang màn hình điện thoại */
            max-width: 480px !important; /* Giới hạn vừa vặn, không bị quá bè */
            background: var(--panel-bg); 
            border-radius: 16px; 
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            position: relative;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #475569; padding-bottom: 8px;
        }

        /* HIỆU ỨNG QUÉT VIỀN ÁNH KIM 3 GIÂY */
        .logo-v3 {
            font-size: 24px !important; 
            font-weight: 900 !important;
            text-transform: uppercase; letter-spacing: 0.5px;
            position: relative;
            background: linear-gradient(90deg, #10b981 0%, #38bdf8 25%, #ffffff 50%, #38bdf8 75%, #10b981 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shineTextV3 3s linear infinite !important;
        }

        @keyframes shineTextV3 {
            0% { background-position: 0% center; }
            30% { background-position: -200% center; }
            100% { background-position: -200% center; }
        }

        .stats { display: flex; gap: 4px; font-size: 11px; }
        .stat-box {
            background: rgba(0,0,0,0.2); padding: 4px 6px;
            border-radius: 6px; border: 1px solid #475569; text-align: center; min-width: 62px;
        }

        .stat-label { font-size: 8px; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-weight: bold; font-size: 11px; color: var(--gold); }
        .stat-val.cash { color: #10b981; }

        .level-control {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 10px; gap: 6px;
        }

        .level-control label { font-size: 12px; font-weight: 600; color: #cbd5e1; }
        .level-input-container { display: flex; align-items: center; gap: 4px; }

        .btn-arrow {
            background: #475569; color: white; border: none;
            width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center;
        }

        input[type="number"], input[type="text"], select {
            background: #0f172a; border: 1px solid #475569; color: #fff; padding: 5px; border-radius: 6px;
        }
        input[type="number"] { width: 50px; text-align: center; font-size: 13px; font-weight: bold; }

        .target-box {
            font-size: 11px; background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3); padding: 4px 6px; border-radius: 6px;
            color: #34d399; font-weight: 600;
        }

        .board-wrapper {
            position: relative; width: 100%; padding-top: 100%;
            background: #0f172a; border-radius: 10px; border: 3px solid #334155; overflow: hidden;
        }

        #board {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 2px; padding: 2px;
        }

        .cell { background-color: var(--cell-empty); border-radius: 4px; transition: background-color 0.1s ease; position: relative; }
        .cell.preview-valid { opacity: 0.5; }
        .cell.preview-invalid { background-color: rgba(239, 68, 68, 0.4) !important; }

        /* HIỆU ỨNG GHÉP XONG HÀNG PHÁT SÁNG CHỚP LÓE RỰC RỠ */
        .cell.clear-flash-v3 {
            background: #ffffff !important;
            box-shadow: 0 0 30px #ffffff, inset 0 0 15px #ffffff !important;
            filter: brightness(3) !important;
            transform: scale(1.08) !important;
            z-index: 999 !important;
        }

        .block-c1 { background: linear-gradient(135deg, #ff2a6d, #9100ff); box-shadow: inset 0 0 6px rgba(255,255,255,0.5); }
        .block-c2 { background: linear-gradient(135deg, #05d9e8, #01012b); box-shadow: inset 0 0 6px rgba(255,255,255,0.5); }
        .block-c3 { background: linear-gradient(135deg, #fcee0a, #ff007f); box-shadow: inset 0 0 6px rgba(255,255,255,0.5); }
        .block-c4 { background: linear-gradient(135deg, #00ff66, #006622); box-shadow: inset 0 0 6px rgba(255,255,255,0.5); }
        .block-c5 { background: linear-gradient(135deg, #ff9900, #ff3300); box-shadow: inset 0 0 6px rgba(255,255,255,0.5); }
        .block-c6 { background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: inset 0 0 6px rgba(255,255,255,0.5); }
        .block-obstacle { background: radial-gradient(circle, #64748b 20%, #334155 80%); border: 2px solid #1e293b; }

        @keyframes explode {
            0% { transform: scale(1.08); opacity: 1; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }
        .cell.exploding { animation: explode 0.25s forwards ease-out; z-index: 10; }

        .tray {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.15); padding: 6px; border-radius: 10px; height: 85px; gap: 6px;
        }

        .tray-slot {
            flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.02); border: 2px dashed #475569; border-radius: 6px;
            touch-action: none;
        }

        .mini-grid { display: grid; gap: 2px; }
        .mini-cell { width: 10px; height: 10px; border-radius: 2px; }
        .mini-cell.empty { background: transparent; }

        .dragging-block-visual {
            position: absolute; pointer-events: none; display: grid; gap: 2px; z-index: 9999;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
        }

        .controls { display: flex; gap: 6px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; color: white; text-align: center; }
        .btn-reset { background: #ef4444; }
        .btn-reroll { background: #475569; }

        .wallet-section {
            background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 5px;
        }
        .wallet-title { font-size: 12px; font-weight: bold; color: #34d399; display: flex; align-items: center; justify-content: space-between; }
        .input-group { display: flex; flex-direction: column; gap: 2px; }
        .input-group label { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .input-row { display: flex; gap: 5px; }
        .input-row select, .input-row input { flex: 1; font-size: 11px; padding: 4px; }
        .btn-withdraw {
            background: linear-gradient(135deg, #10b981, #059669); color: white; font-weight: bold;
            padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 2px;
        }

        .overlay-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; text-align: center; padding: 15px;
        }
        .overlay-modal.show { opacity: 1; pointer-events: auto; }
        .btn-modal-action { background: #10b981; padding: 8px 20px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <div class="logo-v3">Block V2.3.1</div>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Điểm số</div>
                    <div id="score" class="stat-val">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Số hàng phá</div>
                    <div id="lines-cleared" class="stat-val">0 / 3</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Ví Tiền Mặt</div>
                    <div id="wallet-balance" class="stat-val cash">0đ</div>
                </div>
            </div>
        </header>

        <div class="level-control">
            <div>
                <label for="level-select">Cấp Độ:</label>
                <div class="level-input-container" style="margin-top: 2px;">
                    <button class="btn-arrow" id="lvl-prev">&lt;</button>
                    <input type="number" id="level-select" min="1" max="9999" value="1">
                    <button class="btn-arrow" id="lvl-next">&gt;</button>
                </div>
            </div>
            <div class="target-box">Mục tiêu: Phá 3 hàng để WIN</div>
        </div>

        <div class="board-wrapper">
            <div id="board"></div>
            
            <div id="game-over" class="overlay-modal">
                <h2 style="color: #ef4444; margin-bottom: 8px;">Thua Cuộc!</h2>
                <p style="margin-bottom: 15px; font-size:13px;">Không còn vị trí phù hợp cho khối hình.</p>
                <button class="btn-modal-action" style="background:#ef4444;" onclick="resetGame()">Chơi Lại</button>
            </div>

            <div id="game-win" class="overlay-modal">
                <h2 style="color: #10b981; margin-bottom: 8px;">CHIẾN THẮNG!</h2>
                <p style="font-size:13px;">Hoàn thành Cấp độ <span id="popup-lvl-num">1</span></p>
                <div style="font-size: 32px; font-weight: 800; color: #f59e0b; margin: 10px 0;">+$<span id="popup-reward-val">0</span>đ</div>
                <button class="btn-modal-action" onclick="advanceNextLevel()">Nhận & Lên Cấp</button>
            </div>
        </div>

        <div class="tray" id="tray">
            <div class="tray-slot" id="slot-0"></div>
            <div class="tray-slot" id="slot-1"></div>
            <div class="tray-slot" id="slot-2"></div>
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetGame()">Chơi Lại</button>
            <button class="btn btn-reroll" onclick="rerollTray()">Đổi Khối</button>
        </div>

        <div class="wallet-section">
            <div class="wallet-title">
                <span>RÚT TIỀN TỰ ĐỘNG</span>
            </div>
            <div class="input-group">
                <label>Hệ thống nhận tiền</label>
                <select id="withdraw-method">
                    <option value="Momo">Ví Điện Tử Momo</option>
                    <option value="Zalo Pay">Ví Điện Tử Zalo Pay</option>
                    <option value="MB Bank">Ngân hàng MB Bank</option>
                </select>
            </div>
            <div class="input-row">
                <div class="input-group" style="flex: 1.2;">
                    <label>Số tài khoản / SĐT</label>
                    <input type="text" id="withdraw-acc-num" placeholder="Số tài khoản...">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Tên chủ thẻ (Không dấu)</label>
                    <input type="text" id="withdraw-name" placeholder="NGUYEN VAN A">
                </div>
            </div>
            <button class="btn-withdraw" onclick="processWithdrawal()">Xác Nhận Rút Tiền</button>
        </div>
    </div>

    <div id="drag-visual" class="dragging-block-visual" style="display: none;"></div>

    <script>
        const BOARD_SIZE = 8;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0; let linesClearedCount = 0; const TARGET_LINES = 3;
        let cashBalance = parseInt(localStorage.getItem('block_blast_cash_bal')) || 0;
        let currentLevel = 1; let trayBlocks = [null, null, null];
        
        let dragInfo = { isDragging: false, slotIndex: null, currentX: 0, currentY: 0, targetX: 0, targetY: 0, gridCellSize: 0 };
        const SMOOTH_FACTOR = 0.22; let lastHoveredCell = null;

        const SHAPES = [
            { matrix: [[1]], color: 'block-c1' }, { matrix: [[1, 1]], color: 'block-c1' },
            { matrix: [[1], [1]], color: 'block-c1' }, { matrix: [[1, 1, 1]], color: 'block-c2' },
            { matrix: [[1], [1], [1]], color: 'block-c2' }, { matrix: [[1, 1], [1, 1]], color: 'block-c3' },
            { matrix: [[1, 1, 1], [0, 1, 0]], color: 'block-c4' }, { matrix: [[1, 0], [1, 0], [1, 1]], color: 'block-c5' },
            { matrix: [[0, 1], [0, 1], [1, 1]], color: 'block-c5' }, { matrix: [[1, 1, 1, 1]], color: 'block-c6' },
            { matrix: [[1], [1], [1], [1]], color: 'block-c6' }
        ];

        document.getElementById('wallet-balance').innerText = cashBalance + "đ";
        const boardEl = document.getElementById('board');

        function createBoardUI() {
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    boardEl.appendChild(cell);
                }
            }
        }

        function generateLevel(levelNum) {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            score = 0; linesClearedCount = 0; updateScoreUI();
            document.getElementById('game-over').classList.remove('show');
            document.getElementById('game-win').classList.remove('show');
            cancelDrag();

            let obstacleCount = levelNum > 3 ? (levelNum > 20 ? 4 : 2) : 0;
            let seed = levelNum * 555.555; let placed = 0;
            while (placed < obstacleCount) {
                let x = Math.sin(seed++) * 10000; let randIndex = Math.floor((x - Math.floor(x)) * 64);
                let r = Math.floor(randIndex / 8); let c = randIndex % 8;
                if (boardState[r][c] === 0) { boardState[r][c] = 'block-obstacle'; placed++; }
            }
            renderBoard(); generateNewTray();
        }

        function renderBoard() {
            const cells = boardEl.children;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cellEl = cells[r * 8 + c]; cellEl.className = 'cell';
                    if (boardState[r][c] !== 0) cellEl.classList.add(boardState[r][c]);
                }
            }
        }

        function generateNewTray() {
            for (let i = 0; i < 3; i++) {
                let randIdx = Math.floor(Math.random() * SHAPES.length);
                trayBlocks[i] = JSON.parse(JSON.stringify(SHAPES[randIdx]));
                renderTraySlot(i);
            }
            checkGameOverCondition();
        }
        function rerollTray() { generateNewTray(); }

        function renderTraySlot(index) {
            const slot = document.getElementById(`slot-${index}`); slot.innerHTML = '';
            const block = trayBlocks[index]; if (!block) return;
            const matrix = block.matrix;
            const miniGrid = document.createElement('div'); miniGrid.classList.add('mini-grid'); miniGrid.style.gridTemplateColumns = `repeat(${matrix[0].length}, 1fr)`;

            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    const miniCell = document.createElement('div'); miniCell.classList.add('mini-cell');
                    if (matrix[r][c] === 1) miniCell.classList.add(block.color);
                    else miniCell.classList.add('empty');
                    miniGrid.appendChild(miniCell);
                }
            }
            slot.appendChild(miniGrid);
        }

        function initDragEvents() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                slot.addEventListener('pointerdown', (e) => startDrag(e, i));
            }
            window.addEventListener('pointermove', moveDrag);
            window.addEventListener('pointerup', endDrag);
        }

        function startDrag(e, slotIndex) {
            if (!trayBlocks[slotIndex] || dragInfo.isDragging) return;
            e.preventDefault();
            const slot = document.getElementById(`slot-${slotIndex}`);
            const rect = slot.getBoundingClientRect();
            dragInfo.gridCellSize = boardEl.children[0].getBoundingClientRect().width;
            dragInfo.isDragging = true; dragInfo.slotIndex = slotIndex;
            dragInfo.currentX = rect.left + rect.width / 2; dragInfo.currentY = rect.top + rect.height / 2;
            dragInfo.targetX = e.clientX; dragInfo.targetY = e.clientY - 60;
            slot.style.opacity = '0';
            buildDragVisual(trayBlocks[slotIndex]);
        }

        function buildDragVisual(block) {
            const visual = document.getElementById('drag-visual'); visual.innerHTML = '';
            const matrix = block.matrix; const rLen = matrix.length; const cLen = matrix[0].length;
            visual.style.gridTemplateColumns = `repeat(${cLen}, 1fr)`;
            visual.style.width = `${cLen * (dragInfo.gridCellSize + 2)}px`;
            visual.style.height = `${rLen * (dragInfo.gridCellSize + 2)}px`;

            for (let r = 0; r < rLen; r++) {
                for (let c = 0; c < cLen; c++) {
                    const miniCell = document.createElement('div');
                    miniCell.style.width = `${dragInfo.gridCellSize}px`; miniCell.style.height = `${dragInfo.gridCellSize}px`;
                    miniCell.classList.add('mini-cell');
                    if (matrix[r][c] === 1) miniCell.classList.add(block.color);
                    else miniCell.classList.add('empty');
                    visual.appendChild(miniCell);
                }
            }
            visual.style.display = 'grid'; updateVisualPosition();
        }

        function moveDrag(e) {
            if (!dragInfo.isDragging) return;
            dragInfo.targetX = e.clientX; dragInfo.targetY = e.clientY - 60;
            checkGridHover();
        }

        function checkGridHover() {
            const visual = document.getElementById('drag-visual'); const rect = visual.getBoundingClientRect();
            const element = document.elementFromPoint(rect.left + dragInfo.gridCellSize/2, rect.top + dragInfo.gridCellSize/2);
            if (element && element.classList.contains('cell')) {
                const index = Array.from(boardEl.children).indexOf(element);
                const r = Math.floor(index / 8); const c = index % 8;
                if (!lastHoveredCell || lastHoveredCell.r !== r || lastHoveredCell.c !== c) {
                    clearGridPreview(); lastHoveredCell = { r, c }; applyGridPreview(r, c);
                }
            } else if (lastHoveredCell) { clearGridPreview(); lastHoveredCell = null; }
        }

        function applyGridPreview(startR, startC) {
            const block = trayBlocks[dragInfo.slotIndex]; if (!block) return;
            const matrix = block.matrix; const valid = canPlaceBlock(startR, startC, matrix);
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] === 1) {
                        let tR = startR + r; let tC = startC + c;
                        if (tR < 8 && tC < 8) {
                            let cellEl = boardEl.children[tR * 8 + tC];
                            if (cellEl) {
                                cellEl.classList.add(valid ? 'preview-valid' : 'preview-invalid');
                                if (valid) cellEl.classList.add(block.color);
                            }
                        }
                    }
                }
            }
        }
        function clearGridPreview() { renderBoard(); }

        function endDrag(e) {
            if (!dragInfo.isDragging) return;
            const sIdx = dragInfo.slotIndex; const block = trayBlocks[sIdx];
            if (lastHoveredCell && block && canPlaceBlock(lastHoveredCell.r, lastHoveredCell.c, block.matrix)) {
                for (let r = 0; r < block.matrix.length; r++) {
                    for (let c = 0; c < block.matrix[r].length; c++) {
                        if (block.matrix[r][c] === 1) boardState[lastHoveredCell.r + r][lastHoveredCell.c + c] = block.color;
                    }
                }
                score += block.matrix.flat().filter(v => v === 1).length; trayBlocks[sIdx] = null;
                document.getElementById(`slot-${sIdx}`).style.opacity = '1'; renderTraySlot(sIdx);
                clearGridPreview(); checkAndClearLines();
                if (trayBlocks.every(b => b === null)) generateNewTray();
                renderBoard(); updateScoreUI();
                if (linesClearedCount >= TARGET_LINES) triggerWinState();
                else checkGameOverCondition();
                cancelDrag(); return;
            }
            document.getElementById(`slot-${sIdx}`).style.opacity = '1'; clearGridPreview(); cancelDrag();
        }

        function cancelDrag() { dragInfo.isDragging = false; dragInfo.slotIndex = null; lastHoveredCell = null; document.getElementById('drag-visual').style.display = 'none'; }
        
        function updateVisualPosition() {
            if (dragInfo.isDragging) {
                dragInfo.currentX += (dragInfo.targetX - dragInfo.currentX) * SMOOTH_FACTOR; dragInfo.currentY += (dragInfo.targetY - dragInfo.currentY) * SMOOTH_FACTOR;
                const visual = document.getElementById('drag-visual'); const rect = visual.getBoundingClientRect();
                visual.style.left = `${dragInfo.currentX - rect.width / 2}px`; visual.style.top = `${dragInfo.currentY - rect.height / 2}px`;
            }
            requestAnimationFrame(updateVisualPosition);
        }

        function canPlaceBlock(startR, startC, matrix) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] === 1) {
                        let tR = startR + r; let tC = startC + c;
                        if (tR >= 8 || tC >= 8 || boardState[tR][tC] !== 0) return false;
                    }
                }
            }
            return true;
        }

        /* XỬ LÝ GHÉP XONG HÀNG PHÁT SÁNG CHỚP LÓE RỒI BIẾN MẤT */
        function checkAndClearLines() {
            let rToClear = []; let cToClear = [];
            for (let r = 0; r < 8; r++) { if (boardState[r].every(cell => cell !== 0)) rToClear.push(r); }
            for (let c = 0; c < 8; c++) {
                let full = true; for (let r = 0; r < 8; r++) { if (boardState[r][c] === 0) { full = false; break; } }
                if (full) cToClear.push(c);
            }
            let total = rToClear.length + cToClear.length;
            if (total > 0) {
                linesClearedCount += total; score += (total * 8) * total;
                
                // Bước 1: Kích hoạt nhấp nháy chớp lóe sáng trắng rực rỡ tức thì
                rToClear.forEach(r => { for (let c = 0; c < 8; c++) boardEl.children[r * 8 + c].classList.add('clear-flash-v3'); });
                cToClear.forEach(c => { for (let r = 0; r < 8; r++) boardEl.children[r * 8 + c].classList.add('clear-flash-v3'); });

                // Bước 2: Sau hiệu ứng chớp lóe 100ms, tiến hành kích nổ vật lý biến mất ô gạch
                setTimeout(() => {
                    rToClear.forEach(r => { for (let c = 0; c < 8; c++) { let el = boardEl.children[r * 8 + c]; el.className = 'cell exploding'; boardState[r][c] = 0; } });
                    cToClear.forEach(c => { for (let r = 0; r < 8; r++) { let el = boardEl.children[r * 8 + c]; el.className = 'cell exploding'; boardState[r][c] = 0; } });
                    
                    setTimeout(() => { renderBoard(); updateScoreUI(); }, 250);
                }, 100);
            }
        }

        function updateScoreUI() { document.getElementById('score').innerText = score; document.getElementById('lines-cleared').innerText = `${linesClearedCount} / ${TARGET_LINES}`; }
        function triggerWinState() {
            let r = Math.floor(Math.random() * 10) + 1; cashBalance += r; localStorage.setItem('block_blast_cash_bal', cashBalance);
            document.getElementById('wallet-balance').innerText = cashBalance + "đ"; document.getElementById('popup-lvl-num').innerText = currentLevel;
            document.getElementById('popup-reward-val').innerText = r; document.getElementById('game-win').classList.add('show');
        }
        function advanceNextLevel() { if (currentLevel < 9999) currentLevel++; document.getElementById('level-select').value = currentLevel; generateLevel(currentLevel); }
        function checkGameOverCondition() {
            let any = false;
            for (let i = 0; i < 3; i++) {
                if (!trayBlocks[i]) continue;
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) { if (canPlaceBlock(r, c, trayBlocks[i].matrix)) { any = true; break; } }
                    if (any) break;
                }
                if (any) break;
            }
            if (!any && trayBlocks.some(b => b !== null)) document.getElementById('game-over').classList.add('show');
        }
        function resetGame() { generateLevel(currentLevel); }

        function processWithdrawal() {
            const accNum = document.getElementById('withdraw-acc-num').value.trim(); const name = document.getElementById('withdraw-name').value.trim();
            if (!accNum || !name) { alert("Vui lòng điền đầy đủ số tài khoản và tên chủ thẻ!"); return; }
            if (cashBalance <= 0) { alert("Số dư ví không đủ."); return; }
            alert(`Lệnh rút thành công! Đang chuyển khoản ${cashBalance}đ về tài khoản của bạn.`);
            cashBalance = 0; localStorage.setItem('block_blast_cash_bal', cashBalance); document.getElementById('wallet-balance').innerText = "0đ";
        }

        const lvlInput = document.getElementById('level-select');
        lvlInput.addEventListener('change', (e) => { currentLevel = parseInt(e.target.value) || 1; resetGame(); });
        document.getElementById('lvl-prev').addEventListener('click', () => { if (currentLevel > 1) { currentLevel--; lvlInput.value = currentLevel; resetGame(); } });
        document.getElementById('lvl-next').addEventListener('click', () => { if (currentLevel < 9999) { currentLevel++; lvlInput.value = currentLevel; resetGame(); } });

        createBoardUI(); generateLevel(currentLevel); initDragEvents();
    </script>
</body>
</html>
